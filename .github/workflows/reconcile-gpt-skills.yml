name: Reconcile GPT Skills

on:
  push:
    branches:
      - audit/reconcile-all-gpts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reconciliation report
        run: python tools/reconcile_gpt_skill_candidates.py --write
      - name: Commit generated reports
        run: |
          if git diff --quiet -- reports/gpt-skill-reconciliation-2026-08-08.json reports/gpt-skill-reconciliation-2026-08-08.md; then
            echo "No reconciliation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/gpt-skill-reconciliation-2026-08-08.json reports/gpt-skill-reconciliation-2026-08-08.md
          git commit -m "generate full GPT skill reconciliation report"
          git push
