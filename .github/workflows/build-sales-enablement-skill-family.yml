name: Build Sales Enablement Skill Family

on:
  push:
    branches:
      - feat/sales-enablement-skill-family
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Build sales enablement skills and reconcile GPTs
        run: python tools/build_sales_enablement_skill_family.py
      - name: Run sales enablement and GPT mapping tests
        run: |
          python -m pytest tests/test_sales_enablement_skill_family.py tests/test_gpt_skill_alignment_contract.py tests/test_verified_gpt_skill_mappings.py -q
      - name: Commit generated assets
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/assets.json catalog/gpt-skill-mappings.json catalog/gpt-skill-reconciliation-decisions.json gpts/manifests libraries/ai-authoritech/skills/sales-enablement tests/test_sales_enablement_skill_family.py tools/build_sales_enablement_skill_family.py
          git commit -m "build sales enablement skill family"
          git push
