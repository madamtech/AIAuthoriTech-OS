name: Reconcile GPT Skills

on:
  push:
    branches:
      - audit/reconcile-all-gpts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Generate candidate reconciliation report
        run: python tools/reconcile_gpt_skill_candidates.py --write
      - name: Validate and apply curated reconciliation decisions
        run: python tools/apply_gpt_reconciliation_decisions.py --write
      - name: Run GPT skill contract tests
        run: |
          python -m pytest tests/test_gpt_skill_alignment_contract.py tests/test_verified_gpt_skill_mappings.py -q
      - name: Commit reconciliation outputs
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No reconciliation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/gpt-skill-mappings.json catalog/gpt-skill-reconciliation-decisions.json gpts/manifests reports/gpt-skill-reconciliation-2026-08-08.json reports/gpt-skill-reconciliation-2026-08-08.md tools/reconcile_gpt_skill_candidates.py tools/apply_gpt_reconciliation_decisions.py .github/workflows/reconcile-gpt-skills.yml
          git commit -m "apply full curated GPT skill reconciliation"
          git push
